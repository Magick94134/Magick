<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic_k 魔術首頁</title>
    <link rel="icon" href="Bl.png" type="image/png">
    <!-- 引入 Google 字體 Creepster -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Creepster', sans-serif; /* 使用魔幻字體 Creepster */
            background-color: #1a1a1a;
            color: white;
        }

        /* ✅ 跑馬燈樣式 */
        .marquee-inline {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            background-color: #000;
            margin: 0 20px;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 15s linear infinite;
            font-size: px;
            color: #ffd700;
        }

        @keyframes marquee {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* ✅ 導覽欄樣式 */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.8); /* 半透明黑色背景 */
            padding: 10px 20px;
            position: relative;
            z-index: 10;
            background-color: #000; /* 移除星空背景，改為純黑色 */
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 60px;
        }

        .marquee-inline {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 10px;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            transition: background 0.3s;
        }

        .nav-links a:hover {
            background-color: #8b0000;
            border-radius: 5px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #333;
            border-radius: 5px;
            min-width: 100px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .dropdown a {
            display: block;
            padding: 10px;
            color: white;
            text-align: center;
        }

        .dropdown a:hover {
            background-color: #555;
        }

        .nav-links li:hover .dropdown {
            display: block;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .menu-toggle div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 5px 0;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(to right, #4e054e, #1a1a1a);
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .hero p {
            font-size: 20px;
            color: #ddd;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .feature {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .feature .img-placeholder {
            width: 100%;
            height: 150px;
            background: #555;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .feature h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                background-color: #000;
                position: absolute;
                top: 70px;
                right: 20px;
                width: 200px;
            }

            .nav-links.show {
                display: flex;
            }

            .menu-toggle {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="網站 Logo">
        </div>
        <div class="marquee-inline">
            <div class="marquee-text">
                歡迎來到 Magic_K 魔術！探索專業魔術道具、魔術教學與現場演出，讓神奇與夢想一同起飛！
            </div>
        </div>
        <div class="menu-toggle" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="#home">首頁</a></li>
            <li><a href="./products.html">商品目錄</a></li>
            <li><a href="./events.html">活動資訊</a></li>
            <li><a href="./courses.html">課程資訊</a></li>
            <li><a href="#contact">聯絡我們</a>
                <div class="dropdown">
                    <a href="https://line.me">LINE</a>
                    <a href="https://instagram.com">Instagram</a>
                </div>
            </li>
        </ul>
    </nav>

    <div class="hero">
        <h1>魔術的世界</h1>
        <p>探索道具、活動與教學的神奇力量</p>
    </div>

    <div class="features">
        <div class="feature">
            <div class="img-placeholder">圖片區</div>
            <h3>魔術道具</h3>
            <p>各式專業魔術道具，讓你輕鬆學會變魔術</p>
        </div>
        <div class="feature">
            <div class="img-placeholder">圖片區</div>
            <h3>魔術活動</h3>
            <p>參加魔術演出與互動活動，體驗現場的驚喜</p>
        </div>
        <div class="feature">
            <div class="img-placeholder">圖片區</div>
            <h3>魔術教學</h3>
            <p>從新手到專家，提供完整的魔術教學課程</p>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('show');
        }
    </script>
</body>
</html>
