<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="Bl.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic_k魔術</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2b1b1b;
            color: white;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #000;
            position: relative;
        }
        .logo img {
            height: 80px;
        }
        .menu-icon {
            display: none;
            font-size: 30px;
            cursor: pointer;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            display: flex;
        }
        .nav-links li {
            margin: 0 10px;
            position: relative;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background-color: #8b0000;
            border-radius: 5px;
        }
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #333;
            border-radius: 5px;
            min-width: 100px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
        .dropdown a {
            display: block;
            padding: 10px;
            color: white;
            text-align: center;
        }
        .dropdown a:hover {
            background-color: #555;
        }
        .nav-links li:hover .dropdown {
            display: block;
        }
        .marquee-container {
            flex-grow: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            margin: 0 50px;
        }
        .marquee-text {
            display: inline-block;
            animation: marqueeAnimation 13s linear infinite;
        }
        @keyframes marqueeAnimation {
            0% { transform: translateX(100%); }
            90% { transform: translateX(-100%); }
            100% { transform: translateX(-100%); opacity: 0; }
        }
        @media screen and (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                background: #000;
                position: absolute;
                top: 60px;
                right: 0;
                width: 100%;
                text-align: center;
                padding: 10px 0;
            }
            .nav-links.active {
                display: flex;
            }
            .nav-links li {
                margin: 10px 0;
            }
            .menu-icon {
                display: block;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="網站 Logo">
        </div>
        <div class="marquee-container">
            <div class="marquee-text">歡迎來到Magic_K 魔術&nbsp;&nbsp;&nbsp;&nbsp;專業魔術道具、魔術教學、魔術演出&nbsp;&nbsp;&nbsp;&nbsp;學習魔術，感受神奇魅力，立即選購魔術教學課程！</div>
        </div>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <ul class="nav-links">
            <li><a href="#home">首頁</a></li>
            <li><a href="#products">商品目錄</a></li>
            <li><a href="#events">活動資訊</a></li>
            <li><a href="#courses">課程資訊</a></li>
            <li>
                <a href="#">聯絡我們</a>
                <div class="dropdown">
                    <a href="https://line.me/ti/p/Q9YdxdK4Lk" target="_blank">LINE</a>
                    <a href="https://www.instagram.com/magic_k_club?igsh=dmMzeWhydzVsY29t&utm_source=qr" target="_blank">IG</a>
                </div>
            </li>
        </ul>
    </nav>
    <script>
        function toggleMenu() {
            document.querySelector('.nav-links').classList.toggle('active');
        }
    </script>
</body>
</html>
