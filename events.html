<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="Bl.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic_k 商品目錄</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2b1b1b;
            color: white;
            text-align: center;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #000;
        }
        .logo img {
            height: 60px;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            display: flex;
        }
        .nav-links li {
            margin: 0 10px;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background-color: #8b0000;
            border-radius: 5px;
        }
        .container {
            padding: 20px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product {
            background: #444;
            padding: 15px;
            border-radius: 10px;
        }
        .product img {
            width: 100%;
            border-radius: 10px;
        }
        .product h3 {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="網站 Logo"></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="./products.html">商品目錄</a></li>
            <li><a href="./events.html">活動資訊</a></li>
            <li><a href="./courses.html">課程資訊</a></li>
            <li><a href="contact.html">聯絡我們</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <h1>活動資訊</h1>
        <div class="product-grid">
            <div class="product">
                <img src="product1.jpg" alt="商品1">
                <h3>魔術撲克</h3>
                <p>專業魔術撲克，適合各類魔術表演</p>
            </div>
            <div class="product">
                <img src="product2.jpg" alt="商品2">
                <h3>消失硬幣道具</h3>
                <p>讓硬幣瞬間消失的魔術道具</p>
            </div>
            <div class="product">
                <img src="product3.jpg" alt="商品3">
                <h3>魔術繩</h3>
                <p>多功能魔術繩，適合各種變化魔術</p>
            </div>
        </div>
    </div>
</body>
</html>
